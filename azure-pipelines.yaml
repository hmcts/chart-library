name: chart-library pipeline
trigger:
  branches:
    include:
      - refs/tags/*
pr:
  branches:
    include:
      - '*'
resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: 'hmcts'

parameters:
  - name: consumerCharts
    type: object
    default:
      - repository: chart-java
        chartPath: java
        runUnitTests: false
        valuesFile: ci-values-minimal.yaml
      - repository: chart-nodejs
        chartPath: nodejs
        runUnitTests: false
        valuesFile: ci-values-minimal.yaml
      - repository: chart-function
        chartPath: function
        runUnitTests: true
        valuesFile: ci-values-servicebus.yaml
      - repository: chart-job
        chartPath: job
        runUnitTests: true
        valuesFile: ci-values-minimal.yaml
      # Temporarily disabled until upstream chart-servicebus work completes.
      # - repository: chart-servicebus
      #   chartPath: servicebus
      #   runUnitTests: true
      #   valuesFile: ci-values.yaml
      - repository: chart-blobstorage
        chartPath: blobstorage
        runUnitTests: false
        valuesFile: ci-values-minimal.yaml
      - repository: chart-postgresql
        chartPath: postgresql
        runUnitTests: false
        valuesFile: ci-values-minimal.yaml

variables:
  - name: agentPool
    value: ubuntu-latest
  - name: kubeconformVersion
    value: v0.6.7
  - name: helmUnittestVersion
    value: v0.8.0
  - name: kvConnectedServiceName
    value: azurerm-sandbox


jobs:
  - job: Validate
    pool:
      vmImage: ${{ variables.agentPool }}
    steps:
      - task: HelmInstaller@1
        displayName: 'Install Helm'
        inputs:
          helmVersionToInstall: 3.18.0
      - script: helm plugin install https://github.com/helm-unittest/helm-unittest.git
        displayName: 'Install Helm Unit Test Plugin'
      - script: sudo snap install yq
        displayName: 'Install yq'
      - script: ./tests/test-templates.sh
        displayName: 'Run unit tests'

  - job: Validate_Consumer_Compatibility
    displayName: 'Validate consumer compatibility (PR only)'
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    dependsOn: Validate
    pool:
      vmImage: ${{ variables.agentPool }}
    steps:
      - checkout: self
        clean: true
      - task: HelmInstaller@1
        displayName: 'Install Helm'
        inputs:
          helmVersionToInstall: 3.18.0
      - script: |
          set -euo pipefail

          echo "Installing kubeconform"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/$(kubeconformVersion)/kubeconform-linux-amd64.tar.gz" | tar xz -C /tmp/

          echo "Installing yq"
          sudo snap install yq

          echo "Installing helm-unittest plugin"
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$(helmUnittestVersion)"

          /tmp/kubeconform -v
          yq --version
          helm plugin list
        displayName: 'Install validation tooling'

      - script: |
          set -euo pipefail

          echo "Packaging candidate chart-library"
          mkdir -p .tmp/library-package .tmp/consumers
          helm package library/ --destination .tmp/library-package
          LIBRARY_PACKAGE="$(find .tmp/library-package -maxdepth 1 -type f -name 'library-*.tgz' | head -n 1)"
          if [ -z "${LIBRARY_PACKAGE}" ]; then
            echo "No packaged chart-library artifact produced"
            exit 1
          fi
          echo "##vso[task.setvariable variable=libraryPackagePath]${LIBRARY_PACKAGE}"
        displayName: 'Package candidate library'

      - ${{ each consumer in parameters.consumerCharts }}:
        - script: |
            set -euo pipefail

            repo="${{ consumer.repository }}"
            chart_dir="${{ consumer.chartPath }}"
            workdir=".tmp/consumers/${repo}"
            run_unit_tests="${{ consumer.runUnitTests }}"
            values_file="${{ consumer.valuesFile }}"
            library_package="$(libraryPackagePath)"
            library_archive_name="$(basename "${library_package}")"

            echo "---"
            echo "Validating ${repo} (${chart_dir})"
            echo "Running checkout and dependency preparation..."

            # Clone consumer and place candidate library in chart dependency folder.
            git clone --depth 1 --branch master "https://github.com/hmcts/${repo}.git" "${workdir}"
            mkdir -p "${workdir}/${chart_dir}/charts"
            cp "${library_package}" "${workdir}/${chart_dir}/charts/"

            pushd "${workdir}" > /dev/null

            # Unpack library and pin dependency to local candidate.
            echo "Injecting candidate chart-library into consumer dependencies..."
            tar -xzf "${chart_dir}/charts/${library_archive_name}" -C "${chart_dir}/charts"

            echo "Limiting dependencies to chart-library for compatibility run..."
            yq -i '.dependencies = [(.dependencies[] | select(.name == "library"))]' "${chart_dir}/Chart.yaml"
            rm -f "${chart_dir}/Chart.lock"

            # Core compatibility checks for all consumers.
            if [ -z "${values_file}" ] || [ ! -f "${values_file}" ]; then
              for candidate in "ci-values-minimal.yaml" "ci-values.yaml" "${chart_dir}/ci-values-minimal.yaml" "${chart_dir}/ci-values.yaml"; do
                if [ -f "${candidate}" ]; then
                  echo "Values file ${values_file:-<empty>} not found for ${repo}; using ${candidate}"
                  values_file="${candidate}"
                  break
                fi
              done
            fi
            if [ -z "${values_file}" ] || [ ! -f "${values_file}" ]; then
              echo "No compatible values file found for ${repo}"
              exit 1
            fi

            echo "Running helm lint..."
            helm lint "${chart_dir}"
            echo "Running kubeconform now..."
            helm template "${chart_dir}" --values "${values_file}" \
              | /tmp/kubeconform \
                -strict \
                -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

            # Optional consumer-owned unit test suites.
            if [ "${run_unit_tests}" = "true" ]; then
              echo "Running helm-unittest..."
              if ls tests/unit-tests/*.yaml > /dev/null 2>&1; then
                unit_test_glob="tests/unit-tests/*.yaml"
              elif ls "${chart_dir}"/tests/unit-tests/*.yaml > /dev/null 2>&1; then
                unit_test_glob="${chart_dir}/tests/unit-tests/*.yaml"
              else
                echo "No helm-unittest suite found for ${repo}"
                exit 1
              fi

              helm unittest --values "${values_file}" "${chart_dir}" -f ${unit_test_glob}
            fi

            popd > /dev/null
          displayName: 'Validate ${{ consumer.repository }} compatibility'

  - job: Bump_Template_Versions
    displayName: 'Bump template versions (PR only)'
    dependsOn: Validate_Consumer_Compatibility
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    pool:
      vmImage: ${{ variables.agentPool }}
    steps:
      - checkout: self
        clean: true

      - task: AzureKeyVault@2
        displayName: 'Get GitHub API token from Keyvault'
        inputs:
          runAsPreJob: false
          ConnectedServiceName: $(kvConnectedServiceName)
          keyVaultName: 'infra-vault-nonprod'
          secretsFilter: 'github-chart-automation-token'

      - script: |
          set -euo pipefail

          source_branch="${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
          target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"

          if [ -z "${source_branch}" ] || [ -z "${target_branch}" ]; then
            echo "PR source or target branch not available; skipping template bump"
            echo "##vso[task.setvariable variable=shouldRunTemplateBump]false"
            exit 0
          fi

          echo "##vso[task.setvariable variable=sourceBranch]${source_branch}"
          echo "##vso[task.setvariable variable=targetBranch]${target_branch}"
          echo "##vso[task.setvariable variable=shouldRunTemplateBump]true"

          git fetch origin "${source_branch}" "${target_branch}"
          git checkout -B "${source_branch}" "origin/${source_branch}"
        displayName: 'Resolve and fetch PR branches'
        env:
          SYSTEM_PULLREQUEST_SOURCEBRANCH: $(System.PullRequest.SourceBranch)
          SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)

      - script: |
          set -euo pipefail

          changed_files="$(git diff --name-only "origin/$(targetBranch)...HEAD" -- 'library/templates/v2/**' | paste -sd ' ' -)"
          if [ -z "${changed_files}" ]; then
            echo "No template changes detected in library/templates/v2; skipping bump"
            echo "##vso[task.setvariable variable=hasTemplateChanges]false"
            exit 0
          fi

          echo "Template files changed: ${changed_files}"
          echo "##vso[task.setvariable variable=changedTemplateFiles]${changed_files}"
          echo "##vso[task.setvariable variable=hasTemplateChanges]true"

          rm -f /tmp/master-tpl-versions.txt /tmp/bumped-tpl-versions.txt

          master_workdir=".tmp/master-baseline"
          rm -rf "${master_workdir}"
          git worktree add "${master_workdir}" "origin/$(targetBranch)"

          (
            cd "${master_workdir}"
            python scripts/extract-tpl-versions.py
          )

          git worktree remove "${master_workdir}" --force
        displayName: 'Detect template changes and extract baseline'
        condition: and(succeeded(), eq(variables['shouldRunTemplateBump'], 'true'))

      - script: |
          set -euo pipefail
          echo "Template bump candidate files: ${CHANGED_FILES:-<none>}"
          script_output="$(python scripts/bump-tpl-versions.py || true)"
          echo "Bump script output: ${script_output:-<empty>}"

          if [ "${script_output}" = "version_updated" ]; then
            echo "##vso[task.setvariable variable=templateVersionUpdated]true"
          else
            echo "##vso[task.setvariable variable=templateVersionUpdated]false"
          fi
        displayName: 'Run template bump script'
        condition: and(succeeded(), eq(variables['hasTemplateChanges'], 'true'))
        env:
          CHANGED_FILES: $(changedTemplateFiles)

      - script: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No git diff after bump script; skipping commit and push"
            exit 0
          fi

          source_repo_uri="${SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI:-}"
          if [ -z "${source_repo_uri}" ]; then
            source_repo_uri="https://github.com/$(Build.Repository.Name).git"
          fi
          source_repo_uri="${source_repo_uri%/}"
          case "${source_repo_uri}" in
            *.git) push_repo_url="${source_repo_uri}" ;;
            *) push_repo_url="${source_repo_uri}.git" ;;
          esac

          auth_push_url="${push_repo_url/https:\/\//https://x-access-token:${GITHUB_TOKEN}@}"
          echo "Push target repository: ${push_repo_url}"
          echo "Push target branch: $(sourceBranch)"

          git remote set-url origin "${auth_push_url}"

          # Preflight: fail fast with clear diagnostics before creating commit.
          if ! git push --dry-run origin "HEAD:$(sourceBranch)" > /tmp/git-push-dryrun.log 2>&1; then
            echo "Push preflight failed for ${push_repo_url} on branch $(sourceBranch)."
            cat /tmp/git-push-dryrun.log
            echo "Check token scope, org SSO authorization, repository write permission, and branch protection/rulesets."
            exit 1
          fi

          git config user.name hmcts-platform-operations
          git config user.email github-platform-operations@hmcts.net
          git add -A library/templates/v2
          if git diff --cached --quiet; then
            echo "No staged template changes to commit; skipping push"
            exit 0
          fi
          git commit -m "Bump helm template versions"

          git push origin "HEAD:$(sourceBranch)"
        displayName: 'Commit and push bumped template versions'
        condition: and(succeeded(), eq(variables['templateVersionUpdated'], 'true'))
        env:
          GITHUB_TOKEN: $(github-api-token)
          SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI: $(System.PullRequest.SourceRepositoryURI)

  - job: Release_Sbox
    condition: >
      and(
          succeeded(),
          startsWith(variables['Build.SourceBranch'], 'refs/tags/')
        )
    dependsOn: Validate
    pool:
      vmImage: ${{ variables.agentPool }}
    steps:
      - template: steps/charts/release.yaml@cnp-azuredevops-libraries
        parameters:
          chartName: library
          chartReleaseName: chart-library
          chartNamespace: chart-tests
          acrName: hmctssbox
          registryServiceConnection: azurerm-sandbox

  - job: Release
    # Make sure we have a tag to run this job
    condition: >
      and(
          succeeded(),
          startsWith(variables['Build.SourceBranch'], 'refs/tags/')
        )
    dependsOn: Validate
    pool:
      vmImage: ${{ variables.agentPool }}
    steps:
      - template: steps/charts/release.yaml@cnp-azuredevops-libraries
        parameters:
          chartName: library
          chartReleaseName: chart-library
          chartNamespace: chart-tests
