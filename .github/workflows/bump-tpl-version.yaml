name: Bump tpl version

on:
  workflow_dispatch:

jobs:
  bump_version:
    # Skip when the triggering push is the bot's own bump commit, to avoid looping.
    if: ${{ !contains(github.event.head_commit.message, '[auto-bump]') }}
    runs-on: ubuntu-latest
    steps:

      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}  # TEMP-TEST: was 'master', revert before merging
          fetch-depth: 0

      - name: Resolve baseline ref
        id: baseline
        run: |
          before="${{ github.event.before }}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            # No push 'before' available (e.g. workflow_dispatch test run).
            # Diff from where this branch forked off master, so a manual
            # test run sees the full set of changes this branch would
            # bring, same as a real merge push would.
            git fetch origin master
            before="$(git merge-base origin/master HEAD)"
          fi
          echo "ref=${before}" >> "$GITHUB_OUTPUT"

      - name: Checkout previous commit for baseline
        run: git checkout ${{ steps.baseline.outputs.ref }} -- library/templates

      - name: Run extract-tpl-version script
        run: |
          python scripts/extract-tpl-versions.py

      - name: Restore current commit
        run: git checkout HEAD -- library/templates

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          base_sha: ${{ steps.baseline.outputs.ref }}
          files: |
            library/templates/v2/**

      - name: Run bump-tpl-version script
        run: |
          echo SCRIPT_OUTPUT=$(python scripts/bump-tpl-versions.py) >> $GITHUB_ENV
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Commit changes (dry run)
        # TEMP-TEST: replace with real commit/push block below before merging
        if: env.SCRIPT_OUTPUT == 'version_updated'
        run: |
          echo "DRY RUN: template versions were bumped, would commit and push:"
          git status --short
          echo "---"
          git diff
