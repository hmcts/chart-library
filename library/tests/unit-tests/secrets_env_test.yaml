suite: Secrets env tests
templates:
  - templates/v2/deployment.yaml
tests:
  - it: should not render extra env entries when secrets is not set
    set:
      environment:
        SOME_VAR: some-value
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1

  - it: should render an env entry from secretRef and key
    set:
      secrets:
        MY_SECRET:
          secretRef: my-vault-secret
          key: myKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_SECRET
            valueFrom:
              secretKeyRef:
                name: my-vault-secret
                key: myKey

  - it: should lowercase a templated secretRef value
    set:
      secrets:
        MY_SECRET:
          secretRef: "{{ .Release.Name }}-SECRET"
          key: myKey
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: release-name-secret

  - it: should skip a secret entry when disabled is true
    set:
      environment:
        SOME_VAR: some-value
      secrets:
        MY_SECRET:
          secretRef: my-vault-secret
          key: myKey
          disabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_SECRET

  - it: should include a secret entry when disabled is false
    set:
      secrets:
        MY_SECRET:
          secretRef: my-vault-secret
          key: myKey
          disabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_SECRET
            valueFrom:
              secretKeyRef:
                name: my-vault-secret
                key: myKey

  - it: should fail with a descriptive message when the key contains a dot
    set:
      secrets:
        MY.SECRET:
          secretRef: my-vault-secret
          key: myKey
    asserts:
      - failedTemplate:
          errorMessage: "Environment variables can not contain '.' or '-' Failed key: \"MY.SECRET\""

  - it: should fail with a descriptive message when the key contains a dash
    set:
      secrets:
        MY-SECRET:
          secretRef: my-vault-secret
          key: myKey
    asserts:
      - failedTemplate:
          errorMessage: "Environment variables can not contain '.' or '-' Failed key: \"MY-SECRET\""

  - it: should fail when secretRef is missing
    set:
      secrets:
        MY_SECRET:
          key: myKey
    asserts:
      - failedTemplate:
          errorMessage: "Each item in \"secrets:\" needs a secretRef member"

  - it: should fail when key is missing
    set:
      secrets:
        MY_SECRET:
          secretRef: my-vault-secret
    asserts:
      - failedTemplate:
          errorMessage: "Each item in \"secrets:\" needs a key member"

  - it: should use language-specific secrets override when language key is set
    set:
      language: test
      test:
        secrets:
          LANG_SECRET:
            secretRef: lang-vault-secret
            key: langKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANG_SECRET
            valueFrom:
              secretKeyRef:
                name: lang-vault-secret
                key: langKey
