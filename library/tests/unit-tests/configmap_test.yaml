suite: ConfigMap tests
templates:
  - templates/v2/configmap.yaml
tests:
  - it: should not render ConfigMap when configmap is not set
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ConfigMap when configmap is set
    set:
      configmap:
        VAR_A: VALUE_A
    asserts:
      - isKind:
          of: ConfigMap

  - it: should render data entries from configmap values
    set:
      configmap:
        VAR_A: VALUE_A
        VAR_B: VALUE_B
    asserts:
      - equal:
          path: data.VAR_A
          value: VALUE_A
      - equal:
          path: data.VAR_B
          value: VALUE_B

  - it: should render data entries from language-specific configmap override when language key is set
    set:
      language: test
      test:
        configmap:
          VAR_A: LANG_VALUE_A
    asserts:
      - equal:
          path: data.VAR_A
          value: LANG_VALUE_A
