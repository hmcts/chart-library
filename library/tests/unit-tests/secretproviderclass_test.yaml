suite: SecretProviderClass tests
templates:
  - templates/v2/secretproviderclass.yaml
tests:
  - it: should not render when keyVaults is not set
    set:
      global.enableKeyVaults: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global.enableKeyVaults is false
    set:
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when disableKeyVaults is true
    set:
      global.enableKeyVaults: true
      disableKeyVaults: true
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretProviderClass per vault when conditions are met
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretProviderClass

  - it: should render one document per enabled vault
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        vault-a:
          secrets:
            - name: secret-a
        vault-b:
          secrets:
            - name: secret-b
    asserts:
      - hasDocuments:
          count: 2

  - it: should not render a SecretProviderClass for a disabled vault
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        vault-a:
          disabled: true
          secrets:
            - name: secret-a
        vault-b:
          secrets:
            - name: secret-b
    asserts:
      - hasDocuments:
          count: 1

  - it: should include environment suffix in keyvaultName when excludeEnvironmentSuffix is false
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          excludeEnvironmentSuffix: false
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.parameters.keyvaultName
          value: my-vault-aat

  - it: should exclude environment suffix in keyvaultName when excludeEnvironmentSuffix is true
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          excludeEnvironmentSuffix: true
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.parameters.keyvaultName
          value: my-vault

  - it: should use usePodIdentity since no workload identity service account annotation is available in unit tests
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      useWorkloadIdentity: true
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.parameters.usePodIdentity
          value: "true"

  - it: should render objectAlias when a secret is defined as a map with an alias
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: idam-client-secret
              alias: idam.client.secret
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: 'objectAlias: idam\.client\.secret'

  - it: should not render objectAlias when a secret is defined as a map without an alias
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: s2s-secret
    asserts:
      - notMatchRegex:
          path: spec.parameters.objects
          pattern: 'objectAlias'

  - it: should render a secret defined as a plain string
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - plain-secret-name
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: 'objectName: plain-secret-name'

  - it: should not substitute the <ENV> placeholder when global.environment is not set
    set:
      global.enableKeyVaults: true
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: idam-client-<ENV>-secret
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: 'objectName: idam-client-<ENV>-secret'

  - it: should render certs defined as a map with an alias
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
          certs:
            - name: idam-client-cert
              alias: idam.client.cert
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: 'objectName: idam-client-cert[\s\S]*objectType: cert[\s\S]*objectAlias: idam\.client\.cert'

  - it: should render certs defined as a plain string without an alias
    set:
      global.enableKeyVaults: true
      global.environment: aat
      global.tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
          certs:
            - plain-cert-name
    asserts:
      - matchRegex:
          path: spec.parameters.objects
          pattern: 'objectName: plain-cert-name[\s\S]*objectType: cert'

  - it: should use language-specific keyVaults override when language key is set
    set:
      language: test
      test:
        global:
          enableKeyVaults: true
          environment: aat
          tenantId: 00000000-0000-0000-0000-000000000000
        keyVaults:
          lang-vault:
            secrets:
              - name: lang-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-name-library-lang-vault
