suite: SecretCSIVolumes tests
templates:
  - templates/v2/deployment.yaml
tests:
  - it: should not render CSI volumes or mounts when keyVaults is not set
    set:
      global.enableKeyVaults: true
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should not render CSI volumes or mounts when global.enableKeyVaults is false
    set:
      global.enableKeyVaults: false
      keyVaults:
        bulk-scan:
          secrets:
            - name: my-secret
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should not render CSI volumes or mounts when disableKeyVaults is true
    set:
      global.enableKeyVaults: true
      disableKeyVaults: true
      keyVaults:
        bulk-scan:
          secrets:
            - name: my-secret
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should render a CSI volume and mount named after the vault when conditions are met
    set:
      global.enableKeyVaults: true
      keyVaults:
        bulk-scan:
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: vault-bulk-scan
      - equal:
          path: spec.template.spec.volumes[0].csi.driver
          value: secrets-store.csi.k8s.io
      - equal:
          path: spec.template.spec.volumes[0].csi.volumeAttributes.secretProviderClass
          value: release-name-library-bulk-scan
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: vault-bulk-scan

  - it: should not render a CSI volume or mount for a disabled vault
    set:
      global.enableKeyVaults: true
      keyVaults:
        vault-a:
          disabled: true
          secrets:
            - name: secret-a
        vault-b:
          secrets:
            - name: secret-b
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: vault-vault-b
      - notExists:
          path: spec.template.spec.volumes[1]

  - it: should default the mount path to /mnt/secrets/<vault> when mountPath is not set
    set:
      global.enableKeyVaults: true
      keyVaults:
        bulk-scan:
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /mnt/secrets/bulk-scan

  - it: should use the custom mount path when mountPath is set
    set:
      global.enableKeyVaults: true
      keyVaults:
        bulk-scan:
          mountPath: /custom/path
          secrets:
            - name: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /custom/path

  - it: should use language-specific keyVaults override when language key is set
    set:
      language: test
      test:
        global:
          enableKeyVaults: true
        keyVaults:
          lang-vault:
            secrets:
              - name: lang-secret
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: vault-lang-vault
