suite: PodDisruptionBudget conditional rendering
templates:
  - templates/v2/pdb.yaml

tests:
  - it: should render PDB when pdb.enabled is true
    set:
      pdb.enabled: true
      pdb.maxUnavailable: "50%"
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: should not render PDB when pdb.enabled is false
    set:
      pdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render PDB when pdb is not configured
    asserts:
      - hasDocuments:
          count: 0

  - it: should use minAvailable when set
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
    asserts:
      - exists:
          path: spec.minAvailable
      - notExists:
          path: spec.maxUnavailable

  - it: should use maxUnavailable when minAvailable is not set
    set:
      pdb.enabled: true
      pdb.maxUnavailable: "50%"
    asserts:
      - exists:
          path: spec.maxUnavailable
      - notExists:
          path: spec.minAvailable
