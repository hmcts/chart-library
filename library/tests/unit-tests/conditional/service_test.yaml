suite: Service template
templates:
  - templates/v2/service.yaml

tests:
  - it: should set targetPort to applicationPort
    set:
      applicationPort: 4550
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 4550

  - it: should render session affinity annotations when enabled
    set:
      applicationPort: 3000
      ingressSessionAffinity.enabled: true
      ingressSessionAffinity.sessionCookieName: sticky
    asserts:
      - exists:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.sticky.cookie"]
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.sticky.cookie.name"]
          value: sticky

  - it: should not render session affinity annotations when disabled
    set:
      applicationPort: 3000
      ingressSessionAffinity.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should not render session affinity annotations when not configured
    set:
      applicationPort: 3000
    asserts:
      - notExists:
          path: metadata.annotations
