# Only image is required (enforced by required() in _container.tpl).
# global stubs prevent nil-access errors in conditional template blocks.
# All other values are supplied per-test via set: to test conditional logic.
image: hmctspublic.azurecr.io/test/app:latest
global:
  devMode: false
  enableKeyVaults: false
